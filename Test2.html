<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drive Video Kiosk</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #000;
    }

    .status {
      position: fixed;
      top: 12px;
      left: 12px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 6px;
      z-index: 10;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="status" id="status">Loading video…</div>
  <!-- Added autoplay attribute to allow iframe autoplay privileges -->
  <iframe id="player" allow="autoplay *; fullscreen"></iframe>

  <script>
    // Six playlists: Monday, Tuesday, Wednesday, Thursday, Friday, Weekends
    const playlists = {
      monday: [
        { url: "https://drive.google.com/file/d/1JSyEU23gKnxnRL1Adcn1ZzYMWOIu_tpM/preview", duration: "7:31" },//2026年10月宗教周一影片
        { url:"https://drive.google.com/file/d/1qUU6JvYB8gnGcwcwaIgBqfgVOyJTAhx_/preview",duration:"3:22"}, //2026年10月_輕與重之間的呼喚 (粵)
        { url: "https://drive.google.com/file/d/1amt85JWGC2Ww4ZJW7YCBNU7MPOOs6BOc/preview", duration: "4:24" }//暑期活動2026(富善堂)
      ],
      tuesday: [
        {url:"https://drive.google.com/file/d/1LnjGHStYrwsGOx2LOxhR0ONcLRPY4iWF/preview", duration: "0:38"},//聽我講：一齊企硬　唔Take嘢
        {url:"https://drive.google.com/file/d/1-3YuBoq8JLxiaJHBSAjQpmOG1QsC__lJ/preview", duration: "3:09"},//創新ㆍ從未停步 (足本版)
        {url:"https://drive.google.com/file/d/1XC66EXnHbwrKLVbQ4jdiNNgtBqzoo_i4/preview", duration: "0:38"},//「防騙視伏APP」：AI護航　智破騙案
        {url:"https://drive.google.com/file/d/1pi7u9pYiitY3Mdy1nqycklht8w3rhF97/preview", duration: "6:06"},//版權教室： 第十課  設計
        {url:"https://drive.google.com/file/d/1AF5EJlxlr-oGN6dUOZuePd7C_2v3ONsX/preview", duration: "5:27"},//The Copyright Classroom _ Lesson 10 Design
        {url:"https://drive.google.com/file/d/1Oy_vhvqU-5oW7PzcRvynJxEoYHBqGode/preview", duration: "2:13"},//尹光 feat. 阮國恒 (金管局副總裁) _《Link咪亂撳》_ Official MV – 足本版
        {url:"https://drive.google.com/file/d/16PSMxGJnE6TT9Q9h619TOpNo7yAuXOZW/preview", duration: "0:38"},//消息睇真啲
        {url:"https://drive.google.com/file/d/1xt5Jm0S2x6smjDSfqAkS3RjaK0BHv9yV/preview",duration:"0:34"}, //國旗、國徽、國歌
        {url:"https://drive.google.com/file/d/1OQmZ-6P07apPWLeq5EZU1kwIi9lHzbLx/preview",duration:"4:11"}
      ],
      wednesday: [
        { url: "https://drive.google.com/file/d/1Rn8ITEzgXKkI0BgMXy_QoAZZLTpgR1Kg/preview", duration: "2:34" },//sportsday
        { url: "https://drive.google.com/file/d/1TI07zCjW4e7bb3jhhoIW4K2y8Qxp04B-/preview", duration: "5:53"},// Math - 數學符號
        {url:"https://drive.google.com/file/d/1syvTCxpLAnp-L-kMOG4RIWdYXLvddhyJ/preview" , duration: "2:04"},//喜閱一生(悅讀真善美之書送人文關懷)──彭淑敏
        {url:"https://drive.google.com/file/d/1l2FovH6slfVeO1z4ghzx6ivTVyr_cL2V/preview",duration:"2:04"},//喜閱一生(悅讀真善美之書送同理心)──游欣妮 
        {url:"https://drive.google.com/file/d/1sNbW_DgBGWsPT8ULWrhoaIAf7w22WCEd/preview" , duration: "19:52"}//喜閱一生(校園氛圍篇) 
      ],
      thursday: [
        { url: "https://drive.google.com/file/d/1Rn8ITEzgXKkI0BgMXy_QoAZZLTpgR1Kg/preview", duration: "2:34" },//sportsday
        { url: "https://drive.google.com/file/d/1urdkvtIFHafZex-6MOs_sw2jEe3JSXci/preview", duration: "10:19" }//25-26 年度救恩書院感恩回顧 V3 with caption
      ],
      friday: [
        { url: "https://drive.google.com/file/d/1Ukmn_2jXVJ7sG8AymO9rs6ROVELya_-H/preview", duration: "2:30" },//SOWIT Videos - There is light at the end of the tunnel.
        { url: "https://drive.google.com/file/d/1ng1OpUnS4OHmhwrkeZCMWIWYgOc-LmU2/preview", duration: "2:31" }//SOWIT Videos - There is light at the end of the tunnel.
      ],
      weekends: [
        { url: "https://drive.google.com/file/d/1urdkvtIFHafZex-6MOs_sw2jEe3JSXci/preview", duration: "10:19" }//25-26 年度救恩書院感恩回顧 V3 with caption
      ]
    };

    // Choose today's playlist
    function getTodayPlaylist(){
      const d = new Date();
      const day = d.getDay(); // 0 = Sunday, 1 = Monday, ... 6 = Saturday
      if(day === 0 || day === 6) return playlists.weekends;
      switch(day){
        case 1: return playlists.monday;
        case 2: return playlists.tuesday;
        case 3: return playlists.wednesday;
        case 4: return playlists.thursday;
        case 5: return playlists.friday;
        default: return playlists.weekends;
      }
    }

    let videos = getTodayPlaylist();

    const player = document.getElementById("player");
    const status = document.getElementById("status");
    let index = 0;
    let timerId = null;

    function parseDuration(value) {
      if (typeof value === "number") return value;
      if (typeof value !== "string") return 30;

      const parts = value.split(":").map(Number);
      if (parts.length === 2) {
        return parts[0] * 60 + parts[1];
      }
      if (parts.length === 3) {
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }
      return 30;
    }

    function playNext() {
      clearTimeout(timerId);
      const currentVideo = videos[index];
      status.textContent = `Loading video ${index + 1}...`;
      
      // Appended autoplay=1 and mute=1 parameters directly to Google Drive preview links
      player.src = `${currentVideo.url}?autoplay=1&mute=1`;
      
      index = (index + 1) % videos.length;
      timerId = setTimeout(playNext, parseDuration(currentVideo.duration) * 1000);
    }

    player.addEventListener("load", () => {
      status.textContent = "Playing video";
    });

    // Initial trigger to load first video automatically
    playNext();
  </script>
</body>
</html>
